- type: entityTable
  id: RandomAbductorHearts
  table: !type:GroupSelector
    children:
    - !type:GroupSelector
      weight: 100
      children:
      - id: OrganArachnidHeart
      - id: OrganVoxHeart
      - id: OrganAbductorHeart
      - id: OrganPlasmamanHeart
      - id: OrganCarpHeart
      - id: OrganBananaMenHeart
